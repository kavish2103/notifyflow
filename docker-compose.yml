version: '3.8'

services:
  # 1. Relational Database for user preferences, templates, and logs
  postgres:
    image: postgres:15-alpine
    container_name: notifyflow-postgres
    restart: always
    environment:
      POSTGRES_USER: notifyflow_user
      POSTGRES_PASSWORD: notifyflow_secure_password
      POSTGRES_DB: notifyflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifyflow_user -d notifyflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. In-memory caching, rate-limiting, and deduplication store
  redis:
    image: redis:7-alpine
    container_name: notifyflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: notifyflow-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CLUSTER_ID: '4L62xAE2Txy7zpqgCgup1Q'
      # Enforce single-node offset and transaction metadata limits to prevent group coordinator failures
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 4. API Gateway Service (Port 3000)
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: notifyflow-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=info
      - DATABASE_URL=postgres://notifyflow_user:notifyflow_secure_password@postgres:5432/notifyflow_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_notifyflow_gateway_jwt_signing_key_change_me_in_production
      - INGESTION_SERVICE_URL=http://event-ingestion:3002
      - PREFERENCE_SERVICE_URL=http://preference-template:3003
      - ANALYTICS_SERVICE_URL=http://analytics-consumer:3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Event Ingestion Service (Port 3002)
  event-ingestion:
    build:
      context: .
      dockerfile: services/event-ingestion/Dockerfile
    container_name: notifyflow-event-ingestion
    restart: always
    ports:
      - "3002:3002"
    environment:
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_CLIENT_ID=notifyflow-ingestion-docker
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 6. Preference & Template Service (Port 3003)
  preference-template:
    build:
      context: .
      dockerfile: services/preference-template/Dockerfile
    container_name: notifyflow-preference-template
    restart: always
    ports:
      - "3003:3003"
    environment:
      - LOG_LEVEL=info
      - DATABASE_URL=postgres://notifyflow_user:notifyflow_secure_password@postgres:5432/notifyflow_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 7. Email Worker Service (Kafka Consumer)
  email-worker:
    build:
      context: .
      dockerfile: services/email-worker/Dockerfile
    container_name: notifyflow-email-worker
    restart: always
    environment:
      - LOG_LEVEL=info
      - DATABASE_URL=postgres://notifyflow_user:notifyflow_secure_password@postgres:5432/notifyflow_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_CLIENT_ID=notifyflow-email-worker-docker
      - PREFERENCE_SERVICE_URL=http://preference-template:3003
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 8. SMS Worker Service (Kafka Consumer)
  sms-worker:
    build:
      context: .
      dockerfile: services/sms-worker/Dockerfile
    container_name: notifyflow-sms-worker
    restart: always
    environment:
      - LOG_LEVEL=info
      - DATABASE_URL=postgres://notifyflow_user:notifyflow_secure_password@postgres:5432/notifyflow_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_CLIENT_ID=notifyflow-sms-worker-docker
      - PREFERENCE_SERVICE_URL=http://preference-template:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 9. Push Worker Service (Kafka Consumer)
  push-worker:
    build:
      context: .
      dockerfile: services/push-worker/Dockerfile
    container_name: notifyflow-push-worker
    restart: always
    environment:
      - LOG_LEVEL=info
      - DATABASE_URL=postgres://notifyflow_user:notifyflow_secure_password@postgres:5432/notifyflow_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_CLIENT_ID=notifyflow-push-worker-docker
      - PREFERENCE_SERVICE_URL=http://preference-template:3003
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 10. Analytics Consumer & REST Service (Port 3004)
  analytics-consumer:
    build:
      context: .
      dockerfile: services/analytics-consumer/Dockerfile
    container_name: notifyflow-analytics-consumer
    restart: always
    ports:
      - "3004:3004"
    environment:
      - LOG_LEVEL=info
      - DATABASE_URL=postgres://notifyflow_user:notifyflow_secure_password@postgres:5432/notifyflow_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_CLIENT_ID=notifyflow-analytics-consumer-docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  # Named persistent volumes to retain database and queue states
  postgres_data:
    driver: local
  redis_data:
    driver: local
