version: '3.8'

services:
  # 1. Relational Database for user preferences, templates, and logs
  postgres:
    image: postgres:15-alpine
    container_name: notifyflow-postgres
    restart: always
    environment:
      POSTGRES_USER: notifyflow_user
      POSTGRES_PASSWORD: notifyflow_secure_password
      POSTGRES_DB: notifyflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. In-memory caching, rate-limiting, and deduplication store
  redis:
    image: redis:7-alpine
    container_name: notifyflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Apache Kafka - Distributed event stream backbone running in KRaft (ZooKeeperless) mode
  kafka:
    image: apache/kafka:3.7.0
    container_name: notifyflow-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_CLUSTER_ID: '4L62xAE2Txy7zpqgCgup1Q'

volumes:
  # Named persistent volumes to retain database and queue states
  postgres_data:
    driver: local
  redis_data:
    driver: local
